[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --reruns 2
    --reruns-delay 1
    --html=report.html
    --self-contained-html
markers =
    smoke: Quick critical-path checks
    regression: Full regression test suite
    ui: Browser UI tests using Playwright POM
    api: REST API integration and contract tests
    e2e: End-to-end full journey tests
